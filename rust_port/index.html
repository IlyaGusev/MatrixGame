<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MatrixGame</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <script type="module">
    import init from "./pkg/matrixgame_rs.js?v=37";

    const MAX = 2048; // WebGL max texture dimension
    const canvas = document.getElementById("game-canvas");

    function resize() {
      canvas.width  = Math.min(window.innerWidth,  MAX);
      canvas.height = Math.min(window.innerHeight, MAX);
    }
    resize();
    window.addEventListener("resize", resize);


    await init();
  </script>
</body>
</html>
