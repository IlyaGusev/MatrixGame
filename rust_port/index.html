<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MatrixGame</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { width: 100%; height: 100%; display: block; }
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000; color: #c8d4e0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      letter-spacing: 0.15em; text-transform: uppercase;
      transition: opacity 280ms ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    #fps {
      position: fixed; top: 6px; right: 8px; z-index: 20;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px; color: #7cff7c; text-shadow: 0 0 3px #000, 0 0 3px #000;
      pointer-events: none; user-select: none;
    }
    #sound-btn, #menu-btn {
      position: fixed; right: 8px; z-index: 30;
      font-size: 18px; line-height: 1;
      padding: 4px 6px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(200, 212, 224, 0.25);
      cursor: pointer; user-select: none;
    }
    #sound-btn { top: 26px; }
    #menu-btn { top: 62px; }
    #sound-btn:hover, #menu-btn:hover { background: rgba(0, 0, 0, 0.6); }
    #loading .spinner {
      width: 42px; height: 42px; margin-bottom: 18px;
      border: 3px solid rgba(200, 212, 224, 0.18);
      border-top-color: #c8d4e0;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }
    #loading .label { font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ───────────── SR2-style main menu ───────────── */
    #menu {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center;
      background: #02060c;
      font-family: Verdana, "Segoe UI", sans-serif;
      color: #c8e6f5; overflow: hidden;
    }
    #menu[hidden] { display: none; }
    #art-bg { /* nebula shifted toward the classic teal palette */
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
      filter: hue-rotate(155deg) saturate(0.62) brightness(0.72);
    }
    #menu::before { /* vignette so the blue panel reads over the nebula */
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(2, 8, 14, 0.25) 30%, rgba(1, 4, 9, 0.78) 100%),
        linear-gradient(rgba(2, 6, 12, 0.35), rgba(2, 6, 12, 0.35));
    }
    .art { position: absolute; pointer-events: none; user-select: none; }
    #art-planet {
      left: -6vw; bottom: -18vh; width: 40vh; opacity: 0.9;
      mix-blend-mode: screen;
    }
    #art-ship {
      left: -3vw; bottom: -6vh; width: 52vh; max-width: 38vw;
      filter: drop-shadow(0 0 26px rgba(0, 0, 0, 0.85)) brightness(0.85);
    }
    #art-circle { right: 3vw; top: 12vh; width: 30vh; opacity: 0.28; }
    #art-microtext { right: 1.2vw; bottom: 4vh; height: 42vh; opacity: 0.4; }
    #art-logo {
      position: relative; z-index: 2; margin-top: 1.5vh; height: 13vh;
      max-width: 92vw; object-fit: contain;
      filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.9));
      pointer-events: none; user-select: none;
    }

    .panel {
      position: relative; z-index: 2; margin-top: 2.2vh;
      width: min(1020px, 94vw); height: min(628px, 76vh);
      border: 3px solid #2f8fc0; border-radius: 26px;
      background: linear-gradient(160deg, #0a2a44 0%, #06192c 55%, #04121f 100%);
      box-shadow:
        0 0 26px rgba(45, 140, 200, 0.5), 0 12px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 70px rgba(20, 90, 140, 0.35), inset 0 2px 12px rgba(140, 220, 255, 0.25);
    }
    .panel::before {
      content: ""; position: absolute; inset: 5px; border-radius: 19px;
      border: 1px solid rgba(120, 200, 240, 0.28); pointer-events: none;
    }
    .title-tab {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      padding: 6px 30px; white-space: nowrap;
      background: linear-gradient(#0a2438, #04101c);
      border: 2px solid #45c8f2; border-radius: 15px;
      color: #a9e9ff; font-size: 12px; font-weight: bold;
      letter-spacing: 0.28em; text-transform: uppercase;
      text-shadow: 0 0 8px rgba(90, 210, 255, 0.8);
      box-shadow: 0 0 14px rgba(69, 200, 242, 0.55), inset 0 0 10px rgba(69, 200, 242, 0.3);
    }
    #art-guard {
      left: -74px; top: -74px; width: 165px; z-index: 3;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.8));
      display: none;
    }
    @media (min-width: 1360px) { #art-guard { display: block; } }
    #menu-close {
      position: absolute; top: 12px; right: 18px; z-index: 4;
      color: #5d9cbf; cursor: pointer; font-size: 16px;
    }
    #menu-close:hover { color: #d8f6ff; }

    .panel-body {
      position: absolute; inset: 26px 26px 24px 26px;
      display: flex; gap: 22px;
    }
    .col-maps { flex: 1.25; display: flex; flex-direction: column; min-width: 0; }
    .col-side { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .tab {
      padding: 5px 18px; border-radius: 12px; font-size: 11px; font-weight: bold;
      letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap;
      border: 1px solid #1d4a63; background: linear-gradient(#07202f, #051622);
      color: #4f7f9c;
    }
    .tab.active {
      border: 1px solid #55d6ff; color: #dff7ff;
      background: linear-gradient(#12628f, #0a3a5c);
      box-shadow: 0 0 12px rgba(85, 214, 255, 0.45), inset 0 1px 6px rgba(160, 230, 255, 0.35);
      text-shadow: 0 0 6px rgba(140, 230, 255, 0.9);
    }
    .tab.disabled { opacity: 0.55; }

    #levels {
      flex: 1; min-height: 0; overflow-y: auto; padding-right: 8px;
      scrollbar-width: thin; scrollbar-color: #2f8fc0 #062033;
    }
    #levels::-webkit-scrollbar { width: 8px; }
    #levels::-webkit-scrollbar-track { background: #062033; border-radius: 4px; }
    #levels::-webkit-scrollbar-thumb { background: #2f8fc0; border-radius: 4px; }
    .level {
      display: flex; justify-content: space-between; align-items: center;
      margin: 8px 1px; padding: 14px; cursor: pointer;
      border: 1px solid #1c4f6e; border-radius: 7px;
      background: linear-gradient(180deg, #0a2c46, #061c30);
      color: #9fd1e8; font-size: 13px;
    }
    .level:hover { border-color: #3ba7dc; color: #cdeaf8; }
    .level.selected {
      border: 2px solid #6fe0ff; padding: 13px;
      background: linear-gradient(180deg, #10405f, #0a2a46);
      color: #ecfaff; box-shadow: 0 0 12px rgba(110, 220, 255, 0.4);
      text-shadow: 0 0 6px rgba(140, 230, 255, 0.7);
    }
    .level .size { font-size: 11px; color: #5f96b6; letter-spacing: 0.06em; }
    .level.selected .size { color: #9fd8f0; }
    .level .cur { color: #7cff9c; font-size: 10px; letter-spacing: 0.1em; margin-left: 8px; }
    .list-hint {
      margin-top: 8px; text-align: center; font-size: 10px;
      color: rgba(140, 190, 215, 0.5); letter-spacing: 0.14em; text-transform: uppercase;
    }

    .side-top { display: flex; gap: 14px; }
    #map-preview {
      width: 158px; height: 158px; object-fit: cover; flex: none;
      border: 2px solid #2d7ba6; border-radius: 5px;
      background: #04121f; box-shadow: 0 0 14px rgba(0, 0, 0, 0.7);
      image-rendering: auto;
    }
    .opts { flex: 1; min-width: 0; font-size: 11px; }
    .opts-title {
      color: #8fd4f0; font-size: 10px; font-weight: bold; letter-spacing: 0.18em;
      text-transform: uppercase; margin: 2px 0 8px;
      text-shadow: 0 0 6px rgba(90, 200, 250, 0.6);
    }
    .radio {
      display: flex; align-items: center; gap: 8px; margin: 6px 0;
      cursor: pointer; color: #a8d8ee;
    }
    .radio:hover { color: #dff5ff; }
    .radio .dot {
      width: 12px; height: 12px; flex: none; border-radius: 50%;
      border: 2px solid #3ba7dc; background: #041623;
    }
    .radio.checked .dot {
      background: radial-gradient(circle, #aef1ff 0%, #38c6f4 55%, #0a3a5c 100%);
      box-shadow: 0 0 8px rgba(110, 220, 255, 0.8);
    }
    .radio.checked { color: #e4f8ff; }
    .mini-btn {
      margin-top: 8px; padding: 6px 14px; cursor: pointer;
      border: 1px solid #45c8f2; border-radius: 11px;
      background: linear-gradient(#0d4a74, #072c49);
      color: #cdeffd; font-family: inherit; font-size: 10px; font-weight: bold;
      letter-spacing: 0.16em; text-transform: uppercase;
      box-shadow: 0 0 8px rgba(69, 200, 242, 0.35);
    }
    .mini-btn:hover { filter: brightness(1.3); }

    #map-desc {
      flex: 1; min-height: 0; margin-top: 14px; padding: 10px 13px;
      overflow-y: auto; border-radius: 9px;
      background: linear-gradient(#d5e7f4, #c3dbec);
      border: 1px solid #8fb8d4; color: #17334a;
      font-size: 12px; line-height: 1.5;
      scrollbar-width: thin; scrollbar-color: #6d9cbe #b9d2e4;
    }
    #map-desc::-webkit-scrollbar { width: 8px; }
    #map-desc::-webkit-scrollbar-track { background: #b9d2e4; border-radius: 4px; }
    #map-desc::-webkit-scrollbar-thumb { background: #6d9cbe; border-radius: 4px; }
    #map-desc b { color: #0d2334; }

    .actions { display: flex; gap: 14px; margin-top: 16px; justify-content: center; }
    .big-btn {
      width: 138px; padding: 9px 0; cursor: pointer;
      border: 2px solid #45c8f2; border-radius: 17px;
      background: linear-gradient(180deg, #0e527f, #072c49 60%, #051f35);
      color: #d5f4ff; font-family: inherit; font-size: 12px; font-weight: bold;
      letter-spacing: 0.24em; text-transform: uppercase;
      text-shadow: 0 0 6px rgba(120, 220, 255, 0.8);
      box-shadow: 0 0 12px rgba(69, 200, 242, 0.45), inset 0 1px 8px rgba(150, 230, 255, 0.35);
    }
    .big-btn:hover { filter: brightness(1.25); }
    .big-btn:active { filter: brightness(0.9); }

    /* Keybinds view swaps in over the panel body. */
    #binds-view {
      position: absolute; inset: 12px; z-index: 5;
      display: flex; flex-direction: column;
      background: linear-gradient(160deg, #092740 , #04121f);
      border-radius: 18px;
    }
    #binds-view[hidden] { display: none; }
    #binds-view .opts-title { text-align: center; font-size: 12px; margin-bottom: 10px; }
    #binds {
      flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px;
      column-width: 340px; column-gap: 28px;
      scrollbar-width: thin; scrollbar-color: #2f8fc0 #062033;
    }
    #binds::-webkit-scrollbar { width: 8px; }
    #binds::-webkit-scrollbar-track { background: #062033; border-radius: 4px; }
    #binds::-webkit-scrollbar-thumb { background: #2f8fc0; border-radius: 4px; }
    .menu-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0; font-size: 12px; break-inside: avoid;
    }
    .key-chip {
      min-width: 54px; text-align: center; padding: 3px 8px; border-radius: 5px;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
      background: rgba(120, 200, 240, 0.08); border: 1px solid rgba(120, 200, 240, 0.3);
      cursor: pointer; user-select: none;
    }
    .key-chip:hover { background: rgba(120, 200, 240, 0.2); }
    .key-chip.capturing { border-color: #7cff7c; color: #7cff7c; }
    .key-chip.conflict { border-color: #ff6b6b; color: #ff6b6b; }
    .key-chip.custom { border-color: #e0c268; }
    #binds-note { font-size: 11px; color: #6da4c0; min-height: 15px; margin: 6px 10px 0; }
    #binds-view .actions { margin: 10px 10px 4px; }

    #menu .footer {
      position: absolute; right: 16px; bottom: 8px; z-index: 2;
      font-size: 10px; color: rgba(150, 195, 220, 0.55); letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="fps"></div>
  <div id="sound-btn" title="Sound">🔊</div>
  <div id="menu-btn" title="Menu">⚙️</div>
  <div id="menu" hidden>
    <img id="art-bg" src="assets/menu/bg.jpg" alt="" />
    <img class="art" id="art-planet" src="assets/menu/planet.png" alt="" />
    <img class="art" id="art-ship" src="assets/menu/ship.png" alt="" />
    <img class="art" id="art-circle" src="assets/menu/circle.png" alt="" />
    <img class="art" id="art-microtext" src="assets/menu/microtext.png" alt="" />
    <img id="art-logo" src="assets/menu/logo.png" alt="Космические Рейнджеры 2" />
    <div class="panel">
      <div class="title-tab">Бои: быстрый запуск</div>
      <img class="art" id="art-guard" src="assets/menu/gaalship.png" alt="" />
      <span id="menu-close">✕</span>
      <div class="panel-body">
        <div class="col-maps">
          <div class="tabs">
            <span class="tab active">Оригинальные</span>
            <span class="tab disabled">Карты аддона</span>
            <span class="tab disabled">Свои</span>
          </div>
          <div id="levels"></div>
          <div class="list-hint">двойной клик или Enter — запуск боя</div>
        </div>
        <div class="col-side">
          <div class="side-top">
            <img id="map-preview" src="" alt="" />
            <div class="opts">
              <div class="opts-title">Звук</div>
              <div class="radio" id="sound-on"><span class="dot"></span>Включён</div>
              <div class="radio" id="sound-off"><span class="dot"></span>Выключен</div>
              <div class="opts-title" style="margin-top: 14px;">Управление</div>
              <button class="mini-btn" id="binds-open">Настроить…</button>
            </div>
          </div>
          <div id="map-desc"></div>
          <div class="actions">
            <button class="big-btn" id="start-btn">Старт</button>
            <button class="big-btn" id="cancel-btn" hidden>Отмена</button>
          </div>
        </div>
      </div>
      <div id="binds-view" hidden>
        <div class="opts-title" style="margin-top: 8px;">Управление</div>
        <div id="binds"></div>
        <div id="binds-note"></div>
        <div class="actions">
          <button class="mini-btn" id="binds-reset">Сбросить</button>
          <button class="mini-btn" id="binds-back">Назад</button>
        </div>
      </div>
    </div>
    <div class="footer">MatrixGame — Rust/WASM port</div>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="label">Loading…</div>
  </div>

  <script type="module">
    import init from "./pkg/matrixgame_rs.js?v=369";



    // Render-resolution cap. GPU cost is ~linear in pixel count, so we
    // render at most RENDER_MAX px on the long edge and let CSS upscale the
    // canvas to fill the window. Lower = faster. (WebGL hard limit is 2048.)
    const RENDER_MAX = 1600;
    const canvas = document.getElementById("game-canvas");

    function resize() {
      // Clamp proportionally so the backing-buffer aspect matches the CSS
      // display aspect. Clamping each dimension independently stretches the
      // displayed canvas (square content becomes a rectangle).
      const iw = window.innerWidth;
      const ih = window.innerHeight;
      const s = Math.min(1, RENDER_MAX / Math.max(iw, ih));
      canvas.width  = Math.max(1, Math.floor(iw * s));
      canvas.height = Math.max(1, Math.floor(ih * s));
    }
    resize();
    window.addEventListener("resize", resize);

    // ───────────────────────── Main menu ─────────────────────────
    // Levels must have a matching pre-packed bundle in assets/
    // (cargo run --example pack_bundle -- <name>) and preview art in
    // assets/menu/ (cargo run --example menu_assets).
    const LEVELS = [
      ["Атолл", "assets/atoll.bundle", "atoll", "180×176",
       "Кольцо суши посреди океана. Узкие перешейки решают всё: кто удержит броды — тот удержит и атолл. Захватывайте нейтральные заводы по периметру кольца, но не оставляйте свою базу без прикрытия — противник любит десант с тыла."],
      ["Учебная", "assets/training.bundle", "training", "128×199",
       "Полигон для отработки тактики боя против роботов. Вам передан завод по производству роботов: соберите отряд, уничтожьте боевые макеты противника и разрушьте его базу. Помните — с машинами должны драться машины, а ваша задача заключается в том, чтобы ими управлять."],
      ["Перекрёстный огонь", "assets/crossfire.bundle", "crossfire", "264×201",
       "Открытая равнина с пересекающимися коридорами атак. Следите за флангами: огонь ведётся со всех направлений. Турели на перекрёстках окупаются быстрее, чем лишний робот в отряде."],
      ["Острова", "assets/islands.bundle", "islands", "219×245",
       "Архипелаг, связанный мелководьем. Контроль над островами с заводами приносит победу: каждый захваченный завод — это новый поток роботов к линии фронта. Гусеничные шасси уверенно чувствуют себя на бродах."],
      ["Реактор", "assets/reactor.bundle", "reactor", "178×259",
       "Индустриальная зона вокруг энергетического ядра. Узкие проходы и плотная застройка — рай для засад: короткоствольное оружие здесь эффективнее дальнобойного. Держите ремонтника позади ударной группы."],
      ["Убежище", "assets/asylum.bundle", "asylum", "199×228",
       "Скалистое плато с укреплённой цитаделью посреди лавовых полей. Лобовой штурм обречён — ищите обходные пути и расшатывайте оборону рейдами по добывающим заводам противника."],
      ["Армагеддон", "assets/armagedd.bundle", "armagedd", "178×256",
       "Выжженная пустошь под багровым небом. Ресурсов мало, а значит — столкновения неизбежны. Экономьте каждую единицу титана: потерянный в бессмысленной атаке робот здесь не восполняется."],
      ["Вирус", "assets/virus.bundle", "virus", "206×192",
       "Заражённые земли: техника здесь долго не живёт. Быстрые рейды эффективнее долгих осад — собирайте дешёвые манёвренные машины и бейте по заводам, пока противник копит тяжёлый кулак."],
    ];

    // [id, label, default KeyboardEvent.code, context] — must mirror
    // ACTIONS in src/matrix_game/keybinds.rs. Contexts are independent:
    // camera and game defaults intentionally share A/S/D.
    const KEY_ACTIONS = [
      ["cam_forward",      "Camera forward",        "KeyW",         "camera"],
      ["cam_back",         "Camera back",           "KeyS",         "camera"],
      ["cam_left",         "Camera left",           "KeyA",         "camera"],
      ["cam_right",        "Camera right",          "KeyD",         "camera"],
      ["cam_rot_left",     "Rotate left",           "BracketLeft",  "camera"],
      ["cam_rot_right",    "Rotate right",          "BracketRight", "camera"],
      ["cam_pitch_up",     "Pitch up",              "PageUp",       "camera"],
      ["cam_pitch_down",   "Pitch down",            "PageDown",     "camera"],
      ["cam_reset",        "Reset camera",          "Backslash",    "camera"],
      ["stop",             "Stop group",            "KeyS",         "game"],
      ["move",             "Move order",            "KeyM",         "game"],
      ["attack",           "Attack order",          "KeyA",         "game"],
      ["capture",          "Capture order",         "KeyK",         "game"],
      ["patrol",           "Patrol order",          "KeyP",         "game"],
      ["repair",           "Repair order",          "KeyR",         "game"],
      ["explode",          "Explode / self-destruct","KeyE",        "game"],
      ["auto_attack",      "Auto-attack toggle",    "KeyU",         "game"],
      ["auto_capture",     "Auto-capture toggle",   "KeyC",         "game"],
      ["auto_defend",      "Auto-defend toggle",    "KeyD",         "game"],
      ["enter_robot",      "Enter / leave robot",   "Enter",        "game"],
      ["build_robot",      "Build robot",           "KeyB",         "game"],
      ["build_turret",     "Build turret",          "KeyT",         "game"],
      ["cancel_order",     "Cancel order",          "KeyX",         "game"],
      ["minimap_zoom_in",  "Minimap zoom in",       "Equal",        "game"],
      ["minimap_zoom_out", "Minimap zoom out",      "Minus",        "game"],
      ["robot_prev",       "Previous robot",        "Comma",        "game"],
      ["robot_next",       "Next robot",            "Period",       "game"],
      ["pause",            "Pause",                 "Pause",        "game"],
    ];
    const KEYS_STORAGE = "matrixgame.keys";
    const SOUND_STORAGE = "matrixgame.sound";

    // No ?bundle= → main-menu mode: the engine is not started at all;
    // pressing СТАРТ reloads with the param set and boots the game.
    const currentBundle = new URLSearchParams(location.search).get("bundle");
    const inGame = !!currentBundle;

    const menu = document.getElementById("menu");
    const bindsView = document.getElementById("binds-view");
    const bindsDiv = document.getElementById("binds");
    const bindsNote = document.getElementById("binds-note");
    let capturing = null; // action id while waiting for a keypress
    let selected = Math.max(0, LEVELS.findIndex(([, b]) => b === currentBundle));

    function loadOverrides() {
      const out = {};
      for (const pair of (localStorage.getItem(KEYS_STORAGE) || "").split(";")) {
        const i = pair.indexOf("=");
        if (i > 0) out[pair.slice(0, i)] = pair.slice(i + 1);
      }
      return out;
    }
    function saveOverrides(ov) {
      const s = Object.entries(ov).map(([k, v]) => k + "=" + v).join(";");
      if (s) localStorage.setItem(KEYS_STORAGE, s);
      else localStorage.removeItem(KEYS_STORAGE);
      window.dispatchEvent(new Event("matrixgame-keys-changed"));
    }
    function boundKey(id, ov) {
      const a = KEY_ACTIONS.find((a) => a[0] === id);
      return ov[id] || a[2];
    }
    function keyLabel(code) {
      const special = {
        ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→",
        BracketLeft: "[", BracketRight: "]", Backslash: "\\",
        Equal: "=", Minus: "-", Comma: ",", Period: ".",
        Semicolon: ";", Quote: "'", Slash: "/", Backquote: "`",
        Space: "Space", Enter: "Enter",
      };
      if (special[code]) return special[code];
      if (code.startsWith("Key")) return code.slice(3);
      if (code.startsWith("Digit")) return code.slice(5);
      if (code.startsWith("Numpad")) return "Num " + code.slice(6);
      return code;
    }

    function renderBinds() {
      const ov = loadOverrides();
      bindsDiv.textContent = "";
      let lastCtx = null;
      for (const [id, label, def, ctx] of KEY_ACTIONS) {
        if (ctx !== lastCtx) {
          lastCtx = ctx;
          const h = document.createElement("div");
          h.className = "menu-row";
          h.style.color = "#6da4c0";
          h.style.marginTop = "6px";
          h.textContent = ctx === "camera" ? "Камера" : "Игра";
          bindsDiv.appendChild(h);
        }
        const row = document.createElement("div");
        row.className = "menu-row";
        const name = document.createElement("span");
        name.textContent = label;
        const chip = document.createElement("span");
        const key = boundKey(id, ov);
        chip.className = "key-chip" + (key !== def ? " custom" : "");
        chip.textContent = capturing === id ? "…" : keyLabel(key);
        if (capturing === id) chip.classList.add("capturing");
        chip.title = "Click, then press a key (Esc cancels)";
        chip.onclick = () => {
          capturing = capturing === id ? null : id;
          bindsNote.textContent = capturing ? "Нажмите клавишу… (Esc — отмена)" : "";
          renderBinds();
        };
        row.append(name, chip);
        bindsDiv.appendChild(row);
      }
    }

    function assignKey(id, code) {
      const ov = loadOverrides();
      const [, , def, ctx] = KEY_ACTIONS.find((a) => a[0] === id);
      const clash = KEY_ACTIONS.find(
        (a) => a[3] === ctx && a[0] !== id && boundKey(a[0], ov) === code
      );
      if (clash) {
        bindsNote.textContent = `«${keyLabel(code)}» уже назначена: «${clash[1]}»`;
        return;
      }
      if (code === def) delete ov[id];
      else ov[id] = code;
      saveOverrides(ov);
      bindsNote.textContent = "";
    }

    function renderSound() {
      const on = localStorage.getItem(SOUND_STORAGE) !== "off";
      document.getElementById("sound-on").classList.toggle("checked", on);
      document.getElementById("sound-off").classList.toggle("checked", !on);
    }
    function setSound(on) {
      const cur = localStorage.getItem(SOUND_STORAGE) !== "off";
      if (cur === on) return;
      if (inGame) {
        // The Rust audio layer owns the toggle: it binds #sound-btn,
        // flips the master gain, and persists to localStorage.
        document.getElementById("sound-btn").click();
      } else {
        // Engine not running yet — write the pref it reads at startup.
        localStorage.setItem(SOUND_STORAGE, on ? "on" : "off");
      }
      renderSound();
    }

    function renderSide() {
      const [, , img, , desc] = LEVELS[selected];
      document.getElementById("map-preview").src = `assets/menu/maps/${img}.jpg`;
      document.getElementById("map-desc").innerHTML =
        `<b>${LEVELS[selected][0]}.</b> ${desc}`;
    }

    function renderLevels() {
      const div = document.getElementById("levels");
      div.textContent = "";
      LEVELS.forEach(([name, bundle, , size], i) => {
        const el = document.createElement("div");
        el.className = "level" + (i === selected ? " selected" : "");
        const left = document.createElement("span");
        left.textContent = name;
        if (bundle === currentBundle) {
          const cur = document.createElement("span");
          cur.className = "cur";
          cur.textContent = "● идёт бой";
          left.appendChild(cur);
        }
        const right = document.createElement("span");
        right.className = "size";
        right.textContent = size;
        el.append(left, right);
        el.onclick = () => {
          selected = i;
          renderLevels();
          renderSide();
        };
        el.ondblclick = () => startLevel();
        div.appendChild(el);
      });
    }

    function startLevel() {
      const p = new URLSearchParams(location.search);
      p.set("bundle", LEVELS[selected][1]);
      location.search = p.toString(); // (re)load with the chosen map
    }

    // While the menu is open, keystrokes must not reach the game
    // (winit listens on the canvas); capture-phase + stopPropagation
    // runs before its handler.
    function menuKeydown(e) {
      e.stopPropagation();
      if (capturing) {
        e.preventDefault();
        if (e.code !== "Escape") assignKey(capturing, e.code);
        capturing = null;
        renderBinds();
        if (!bindsNote.textContent.includes("уже")) bindsNote.textContent = "";
      } else if (e.code === "Escape") {
        if (!bindsView.hidden) closeBinds();
        else if (inGame) closeMenu();
      } else if (e.code === "Enter" && bindsView.hidden) {
        startLevel();
      }
    }
    function openMenu() {
      menu.hidden = false;
      renderLevels();
      renderSide();
      renderSound();
      window.addEventListener("keydown", menuKeydown, true);
    }
    function closeMenu() {
      if (!inGame) return; // main menu is the whole page — nothing to close
      menu.hidden = true;
      closeBinds();
      window.removeEventListener("keydown", menuKeydown, true);
    }
    function openBinds() {
      bindsView.hidden = false;
      renderBinds();
    }
    function closeBinds() {
      bindsView.hidden = true;
      capturing = null;
      bindsNote.textContent = "";
    }
    document.getElementById("menu-btn").onclick = () => (menu.hidden ? openMenu() : closeMenu());
    document.getElementById("menu-close").onclick = closeMenu;
    document.getElementById("start-btn").onclick = startLevel;
    document.getElementById("cancel-btn").onclick = closeMenu;
    document.getElementById("binds-open").onclick = openBinds;
    document.getElementById("binds-back").onclick = closeBinds;
    document.getElementById("sound-on").onclick = () => setSound(true);
    document.getElementById("sound-off").onclick = () => setSound(false);
    document.getElementById("binds-reset").onclick = () => {
      saveOverrides({});
      capturing = null;
      renderBinds();
      bindsNote.textContent = "";
    };

    if (inGame) {
      document.getElementById("menu-close").style.display = "";
      document.getElementById("cancel-btn").hidden = false;
      await init();
    } else {
      document.getElementById("loading").style.display = "none";
      document.getElementById("sound-btn").style.display = "none";
      document.getElementById("menu-btn").style.display = "none";
      document.getElementById("menu-close").style.display = "none";
      openMenu();
    }
  </script>
</body>
</html>
